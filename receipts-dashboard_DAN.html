    &lt;div&gt;Żabka: 118,08 PLN · Kaufland: 148,09 PLN · Carrefour: 274,88 PLN. Суммы, количества и скидки перенесены с трёх JPG-чеков.&lt;/div&gt;
    &lt;div&gt;Скидки: 5,08 PLN на Szamamm apple pancakes и 1,00 PLN на Tuna chunks in oil. Общие 6,08 PLN повторно не вычитаются. Скидка в процентах = экономия / сумма до скидки; для групп используется взвешенный процент.&lt;/div&gt;

    &lt;div&gt;Вероятные соответствия двух сокращённых названий помечены рядом с товарами. Оригинал и ссылка на каталог доступны в деталях. Бонусные баллы не считаются денежной скидкой.&lt;/div&gt;
